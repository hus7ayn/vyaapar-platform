<!doctype html>
<meta charset="utf-8">
<title>Mockup — Enter code & set new password</title>
<style>
  :root { --brand: hsl(348, 85%, 52%); --ink: #1b1b1f; --muted: #6b7280; --line: #e5e7eb; --ok: #047857; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
         background: #f5f6f8; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line);
          border-radius: 12px; padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .brand { font-weight: 800; font-size: 20px; color: var(--brand); margin-bottom: 22px; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  p.sub b { color: var(--ink); }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 5px; }
  input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line);
          border-radius: 8px; font-size: 15px; }
  input.code { letter-spacing: .5em; text-align: center; font-size: 22px; font-weight: 700;
               font-family: ui-monospace, SFMono-Regular, Menlo, monospace; height: 54px; }
  button { width: 100%; height: 42px; margin-top: 20px; border: 0; border-radius: 8px;
           background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .rules { margin-top: 7px; font-size: 12px; color: var(--muted); }
  .rules li { margin: 2px 0; }
  .rules li.met { color: var(--ok); }
  .resend { display: flex; justify-content: space-between; align-items: center;
            margin-top: 16px; font-size: 13px; color: var(--muted); }
  .resend a { color: var(--brand); font-weight: 600; text-decoration: none; }
</style>

<div class="card">
  <div class="brand">Vyaapar</div>
  <h1>Check your email</h1>
  <p class="sub">We sent a six-digit code to <b>cashier@grandplaza.demo</b>. It expires in 10 minutes.</p>

  <label for="code">Six-digit code</label>
  <input id="code" class="code" inputmode="numeric" maxlength="6" placeholder="••••••" value="418290">

  <label for="pw">New password</label>
  <input id="pw" type="password" value="Counter@2026">
  <ul class="rules">
    <li class="met">✓ At least 8 characters</li>
    <li class="met">✓ One capital letter and one number</li>
    <li>• One symbol</li>
  </ul>

  <button>Set new password and sign in</button>

  <div class="resend">
    <span>Didn't get it? Check spam.</span>
    <a href="#">Send again</a>
  </div>
</div>
