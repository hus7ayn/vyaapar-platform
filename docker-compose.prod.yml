# Production stack — designed for Oracle Cloud Always Free (single VM).
# Usage: copy deploy/oracle/env.template → .env, set PUBLIC_URL, then:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_platform}']
      interval: 5s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_platform}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus_platform}?schema=public
      # Uploads live on a persisted disk volume — no object-storage daemon needed.
      STORAGE_DRIVER: disk
      UPLOADS_DIR: /data/uploads
      API_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env — e.g. http://YOUR_VM_IP}
      API_PORT: 4000
      NODE_ENV: production
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env — e.g. http://YOUR_VM_IP}
        NEXT_PUBLIC_PUSHER_KEY: ${PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${PUSHER_CLUSTER:-}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_URL}
      NODE_ENV: production
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    networks:
      - internal

volumes:
  postgres_data:
  uploads_data:

networks:
  internal:
    driver: bridge
